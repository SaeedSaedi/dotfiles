# ══════════════════════════════════════════════════════════════════════════════
#  Kitty — Catppuccin Mocha
# ══════════════════════════════════════════════════════════════════════════════

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMonoNLNFM Regular
bold_font        JetBrainsMonoNLNFM Bold
italic_font      JetBrainsMonoNLNFM Italic
bold_italic_font JetBrainsMonoNLNFM Bold Italic
font_size        13.0
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor                #f5e0dc
cursor_text_color     #1e1e2e
cursor_shape          block
cursor_blink_interval 0

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Mouse ─────────────────────────────────────────────────────────────────────
url_color             #89b4fa
url_style             curly
open_url_with         default
copy_on_select        no

# ── Window ────────────────────────────────────────────────────────────────────
window_padding_width     12
window_border_width      1px
draw_minimal_borders     yes
hide_window_decorations  no
confirm_os_window_close  0
background_opacity       0.96
dynamic_background_opacity no

# ── Tab bar ───────────────────────────────────────────────────────────────────
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1
tab_bar_edge            bottom
active_tab_foreground   #1e1e2e
active_tab_background   #89b4fa
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244
inactive_tab_font_style normal
tab_bar_background      #181825
tab_title_template      " {title} "

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Performance ───────────────────────────────────────────────────────────────
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# ── Shell ─────────────────────────────────────────────────────────────────────
shell            zsh
editor           nvim

# ── Keymaps ───────────────────────────────────────────────────────────────────
# Tabs
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+w    close_tab
map ctrl+shift+]    next_tab
map ctrl+shift+[    previous_tab
map ctrl+shift+1    goto_tab 1
map ctrl+shift+2    goto_tab 2
map ctrl+shift+3    goto_tab 3
map ctrl+shift+4    goto_tab 4
map ctrl+shift+5    goto_tab 5

# Splits (windows)
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+h        neighboring_window left
map ctrl+shift+l        neighboring_window right
map ctrl+shift+k        neighboring_window up
map ctrl+shift+j        neighboring_window down

# Font size
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Clipboard
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard

# Scrollback
map ctrl+shift+up      scroll_line_up
map ctrl+shift+down    scroll_line_down
map ctrl+shift+page_up    scroll_page_up
map ctrl+shift+page_down  scroll_page_down
map ctrl+shift+home    scroll_home
map ctrl+shift+end     scroll_end

# ── Catppuccin Mocha — colors ─────────────────────────────────────────────────
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Normal colors
color0   #45475a
color1   #f38ba8
color2   #a6e3a1
color3   #f9e2af
color4   #89b4fa
color5   #f5c2e7
color6   #94e2d5
color7   #bac2de

# Bright colors
color8   #585b70
color9   #f38ba8
color10  #a6e3a1
color11  #f9e2af
color12  #89b4fa
color13  #f5c2e7
color14  #94e2d5
color15  #a6adc8

# Extended colors
color16  #fab387
color17  #f5e0dc

# ── Marks (kitty hints / search) ──────────────────────────────────────────────
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec
