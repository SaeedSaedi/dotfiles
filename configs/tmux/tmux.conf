# ── GENERAL ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'  # cursor shape passthrough
set -g focus-events on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -sg escape-time 10           # fast escape for neovim
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g set-clipboard on

# window/pane index starts at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── KEY BINDINGS ──────────────────────────────────────────────────────────────
# split panes, keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message " Config reloaded"

# quick session switcher
bind s choose-tree -sZ

# ── COPY MODE (vim) ───────────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line

# ── ONE DARK PRO COLORS ───────────────────────────────────────────────────────
#   bg:       #21252b    dark_bg:  #181a1f    panel:    #282c34
#   fg:       #abb2bf    comment:  #5c6370
#   blue:     #61afef    green:    #98c379    yellow:   #e5c07b
#   purple:   #c678dd    red:      #e06c75    cyan:     #56b6c2

# ── STATUS BAR ────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-style                  "bg=#21252b,fg=#abb2bf"
set -g status-left-length  40
set -g status-right-length 120

# left: session badge
set -g status-left \
  "#[bg=#61afef,fg=#21252b,bold]  #S #[bg=#21252b,fg=#61afef,nobold] "

# window list
set -g window-status-separator       ""
set -g window-status-style           "bg=#21252b,fg=#5c6370"
set -g window-status-format          " #I #W "
set -g window-status-current-style   "bg=#282c34,fg=#61afef,bold"
set -g window-status-current-format  "#[bg=#282c34,fg=#21252b] #[fg=#61afef] #I #W #[bg=#21252b,fg=#282c34]"
set -g window-status-activity-style  "bg=#21252b,fg=#e5c07b"

# right: path | git branch | date | time
set -g status-right "#[fg=#5c6370] │ #[fg=#98c379] #{b:pane_current_path} #[fg=#5c6370]│ #[fg=#c678dd]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null | head -c 24) #[fg=#5c6370]│ #[fg=#e5c07b] %d %b #[fg=#5c6370]│ #[fg=#56b6c2] %H:%M "

# ── PANE & MESSAGE STYLE ──────────────────────────────────────────────────────
set -g pane-border-style        "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g pane-border-lines        single

set -g message-style         "bg=#282c34,fg=#e5c07b,bold"
set -g message-command-style "bg=#282c34,fg=#e5c07b"
set -g mode-style            "bg=#61afef,fg=#21252b"

set -g popup-border-style    "fg=#61afef"
set -g popup-border-lines    rounded

# ── ACTIVITY ──────────────────────────────────────────────────────────────────
set -g monitor-activity on
set -g visual-activity  off
set -g monitor-bell     on
set -g visual-bell      off

# ── PLUGINS ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @yank_with_mouse          off
set -g @continuum-restore        'on'
set -g @continuum-save-interval  '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim  'session'

run '~/.tmux/plugins/tpm/tpm'
